name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Ultralytics
      run: pip install ultralytics

    - name: Generate YOLOv8 TFLite Model
      run: |
        python scripts/export_model.py
        mkdir -p app/src/main/assets
        # Ultralytics exports the model into a directory named {model_name}_saved_model
        find . -name "*.tflite" -exec cp {} app/src/main/assets/yolov8n_float16.tflite \;

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: wrapper

    - name: Build with Gradle
      run: gradle build

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
